[build]
  # Diretório onde estão os arquivos do site
  publish = "."

# Endereços curtos e compatibilidade com links existentes
[[redirects]]
  from = "/servicos"
  to = "/#criamos"
  status = 301

[[redirects]]
  from = "/servicos.html"
  to = "/#criamos"
  status = 301

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 200

# Compatibilidade com a antiga página de contato
[[redirects]]
  from = "/thank-you"
  to = "/obrigado.html"
  status = 200

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
